name: Sync upstream and deploy

on:
  schedule:
    - cron: '17 2 * * *' # 10:17 Asia/Manila; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'nextwa/cloud-mail'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Sync application changes without replacing deployment workflows
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/maillab/cloud-mail.git
          git fetch upstream main
          latest=$(git rev-parse upstream/main)
          if [ -f .upstream-revision ]; then
            base=$(cat .upstream-revision)
          else
            base=$(git merge-base HEAD upstream/main)
          fi
          git cat-file -e "${base}^{commit}"
          git diff --binary "$base" "$latest" -- . ':(exclude).github/**' ':(exclude).upstream-revision' ':(exclude)DEPLOYMENT.md' ':(exclude)AGENTS.md' > "$RUNNER_TEMP/upstream.patch"
          if [ -s "$RUNNER_TEMP/upstream.patch" ]; then
            git apply --3way --index "$RUNNER_TEMP/upstream.patch"
          fi
          printf '%s\n' "$latest" > .upstream-revision
          git add .upstream-revision
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync maillab/cloud-mail@${latest:0:8}"
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Explicitly dispatch deployment
        uses: actions/github-script@v7
        env:
          SYNC_CHANGED: ${{ steps.sync.outputs.changed }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow_id = 'deploy-cloudflare.yml';
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, branch: 'main', per_page: 1
            });
            const latest = runs.data.workflow_runs[0];
            const retry = !latest || (latest.status === 'completed' && latest.conclusion !== 'success');
            if (process.env.SYNC_CHANGED === 'true' || retry || context.eventName === 'workflow_dispatch') {
              await github.rest.actions.createWorkflowDispatch({owner, repo, workflow_id, ref: 'main'});
              core.summary.addRaw('Application synchronized; deployment dispatched. Workflow files are preserved.');
            } else {
              core.summary.addRaw('Already current; no deployment required.');
            }
            await core.summary.write();
